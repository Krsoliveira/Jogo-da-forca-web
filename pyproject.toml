[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert é o idioma do pytest
"scripts/*" = ["S310", "S202"]  # download de URL fixa e arquivo verificado por hash

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # permite importar scripts.gerar_banco nos testes

[tool.bandit]
exclude_dirs = ["tests", "venv"]
