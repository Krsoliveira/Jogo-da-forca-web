[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert é o idioma do pytest
"tests/e2e/*" = ["S101", "S104"]  # servidor de teste local
"scripts/*" = ["S310", "S202"]  # download de URL fixa e arquivo verificado por hash

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # permite importar scripts.gerar_banco nos testes
# Testes de navegador (tests/e2e) rodam num job próprio do CI: pytest -m e2e
addopts = "-m 'not e2e'"
markers = ["e2e: testes de ponta a ponta no navegador (Playwright); exigem npm run build"]

[tool.bandit]
exclude_dirs = ["tests", "venv"]
