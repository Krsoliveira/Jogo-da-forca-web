[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert é o idioma do pytest
"palavras.py" = ["E501"]  # arquivo de dados: dicas são textos longos

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "venv"]
