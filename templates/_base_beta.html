<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06060f">
    <meta name="color-scheme" content="dark">
    <title>{% block titulo %}Forca{% endblock %}</title>
    <meta name="description" content="Jogo da forca com tema neon: escolha a dificuldade e a categoria e descubra a palavra.">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
    <link rel="preload" href="{{ url_for('static', filename='fonts/space-grotesk-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ version }}">
    <script type="module" src="{{ url_for('static', filename='js/dist/' ~ entrada ~ '.js') }}?v={{ version }}"></script>
</head>
<body>
    <div class="fundo-grade" aria-hidden="true"></div>
    <a href="#conteudo" class="btn sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-50">Ir para o conteúdo</a>
    {% block corpo %}{% endblock %}
</body>
</html>
